<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vite build anatomy</title>
  <desc id="desc">Process diagram showing Vue source files passing through npm run build and becoming a generated dist folder with browser-ready assets.</desc>
  <rect width="1600" height="900" fill="#f8f3ea"/>
  <text x="100" y="116" fill="#2d2724" font-family="Arial, sans-serif" font-size="48" font-weight="700">Vite Build Anatomy</text>
  <g font-family="Arial, sans-serif">
    <rect x="100" y="220" width="380" height="430" rx="22" fill="#fffaf2" stroke="#2d2724" stroke-width="5"/>
    <text x="142" y="292" fill="#7a1828" font-size="38" font-weight="700">SOURCE</text>
    <text x="142" y="365" fill="#2d2724" font-size="31">src/</text>
    <text x="142" y="420" fill="#2d2724" font-size="31">Vue components</text>
    <text x="142" y="475" fill="#2d2724" font-size="31">CSS + assets</text>
    <text x="142" y="530" fill="#2d2724" font-size="31">package.json</text>
    <rect x="610" y="275" width="380" height="320" rx="22" fill="#ffffff" stroke="#c4a35a" stroke-width="6"/>
    <text x="720" y="402" fill="#7a1828" font-size="38" font-weight="700">BUILD</text>
    <text x="682" y="470" fill="#2d2724" font-size="34">npm run build</text>
    <rect x="1120" y="220" width="380" height="430" rx="22" fill="#fffaf2" stroke="#2d2724" stroke-width="5"/>
    <text x="1162" y="292" fill="#7a1828" font-size="38" font-weight="700">OUTPUT</text>
    <text x="1162" y="365" fill="#2d2724" font-size="31">dist/</text>
    <text x="1162" y="420" fill="#2d2724" font-size="31">index.html</text>
    <text x="1162" y="475" fill="#2d2724" font-size="31">hashed assets/</text>
    <text x="1162" y="552" fill="#4f4540" font-size="27">Generated; deploy this output.</text>
  </g>
  <g fill="none" stroke="#7a1828" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M510 435h72"/>
    <path d="M562 407l40 28-40 28"/>
    <path d="M1020 435h72"/>
    <path d="M1072 407l40 28-40 28"/>
  </g>
  <text x="800" y="755" fill="#4f4540" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">Do not hand-edit dist. Fix source, rebuild, then deploy the new output.</text>
</svg>
