<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Black Swan Bistro production readiness flow</title>
  <desc id="desc">The Black Swan Bistro project moves from local files through a production readiness check to a live server and visitor browser.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; }
      .panel-strong { fill: #ecfeff; stroke: #0891b2; stroke-width: 3; }
      .title { fill: #111827; font: 700 24px Arial, sans-serif; }
      .label { fill: #1f2937; font: 700 18px Arial, sans-serif; }
      .body { fill: #4b5563; font: 15px Arial, sans-serif; }
      .mono { fill: #111827; font: 14px Menlo, Consolas, monospace; }
      .arrow { fill: none; stroke: #0f766e; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .badge { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .check { fill: #047857; font: 700 18px Arial, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0f766e" />
    </marker>
  </defs>

  <rect class="bg" width="960" height="520" rx="18" />
  <text x="48" y="58" class="title">From local project to production website</text>
  <text x="48" y="86" class="body">Part 5 is the review step before the bistro site goes live.</text>

  <rect x="50" y="140" width="220" height="230" rx="14" class="panel" />
  <text x="82" y="180" class="label">Local project</text>
  <text x="82" y="214" class="mono">black-swan-bistro/</text>
  <text x="104" y="242" class="mono">index.html</text>
  <text x="104" y="268" class="mono">menu.html</text>
  <text x="104" y="294" class="mono">css/style.css</text>
  <text x="104" y="320" class="mono">images/</text>

  <rect x="370" y="118" width="240" height="276" rx="14" class="panel-strong" />
  <text x="408" y="158" class="label">Production check</text>
  <rect x="405" y="188" width="170" height="34" rx="17" class="badge" />
  <text x="423" y="211" class="body">files are clean</text>
  <text x="408" y="254" class="check">✓ links work</text>
  <text x="408" y="284" class="check">✓ images load</text>
  <text x="408" y="314" class="check">✓ metadata fits</text>
  <text x="408" y="344" class="check">✓ mobile tested</text>

  <rect x="710" y="140" width="200" height="230" rx="14" class="panel" />
  <text x="750" y="180" class="label">Live site</text>
  <rect x="760" y="210" width="100" height="72" rx="10" fill="#111827" />
  <rect x="775" y="226" width="70" height="10" rx="5" fill="#f9fafb" />
  <rect x="775" y="248" width="46" height="8" rx="4" fill="#67e8f9" />
  <rect x="775" y="264" width="58" height="8" rx="4" fill="#fbbf24" />
  <text x="744" y="322" class="body">A visitor can load,</text>
  <text x="744" y="346" class="body">read, and navigate it.</text>

  <path d="M280 255 C315 255 328 255 358 255" class="arrow" />
  <path d="M620 255 C655 255 668 255 698 255" class="arrow" />

  <text x="78" y="430" class="body">Development asks: does it work here?</text>
  <text x="382" y="430" class="body">Preparation asks: will it survive launch?</text>
  <text x="712" y="430" class="body">Production asks: can others use it?</text>
</svg>
