<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Website care lifecycle from launch to improvement</title>
  <desc id="desc">A circular workflow showing build, test, deploy, monitor, maintain, and improve as an ongoing website care cycle.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2f4858"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172a3a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1120" height="520" rx="28" fill="#f8fafb"/>
  <text x="560" y="56" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#172a3a">A live website moves through a care cycle</text>
  <text x="560" y="92" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#52606d">Launch is one step. Care is the loop that keeps the site useful.</text>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" filter="url(#shadow)">
    <g>
      <rect x="460" y="128" width="200" height="78" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
      <text x="560" y="176" text-anchor="middle" font-size="24" font-weight="700" fill="#0369a1">Build</text>
    </g>
    <g>
      <rect x="726" y="206" width="200" height="78" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
      <text x="826" y="254" text-anchor="middle" font-size="24" font-weight="700" fill="#b45309">Test</text>
    </g>
    <g>
      <rect x="726" y="326" width="200" height="78" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
      <text x="826" y="374" text-anchor="middle" font-size="24" font-weight="700" fill="#15803d">Deploy</text>
    </g>
    <g>
      <rect x="460" y="404" width="200" height="78" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
      <text x="560" y="452" text-anchor="middle" font-size="24" font-weight="700" fill="#6d28d9">Monitor</text>
    </g>
    <g>
      <rect x="194" y="326" width="200" height="78" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
      <text x="294" y="374" text-anchor="middle" font-size="24" font-weight="700" fill="#be123c">Maintain</text>
    </g>
    <g>
      <rect x="194" y="206" width="200" height="78" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
      <text x="294" y="254" text-anchor="middle" font-size="24" font-weight="700" fill="#0f766e">Improve</text>
    </g>
  </g>
  <g fill="none" stroke="#2f4858" stroke-width="4" marker-end="url(#arrow)">
    <path d="M650 171 C720 178 762 190 798 211"/>
    <path d="M826 284 V316"/>
    <path d="M798 385 C758 415 704 434 672 441"/>
    <path d="M448 441 C386 432 344 410 316 385"/>
    <path d="M294 326 V294"/>
    <path d="M316 226 C358 190 414 174 448 169"/>
  </g>
  <circle cx="560" cy="300" r="88" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
  <text x="560" y="290" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#172a3a">Care plan</text>
  <text x="560" y="322" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#52606d">small checks, often</text>
</svg>
