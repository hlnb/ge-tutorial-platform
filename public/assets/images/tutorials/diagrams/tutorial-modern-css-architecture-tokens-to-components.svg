<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Design tokens flowing into interface components</title>
  <desc id="desc">Design tokens such as color and spacing custom properties feed consistent button, card, and callout components.</desc>
  <rect width="960" height="540" fill="#fbfaf7"/>
  <text x="70" y="66" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#232323">Design tokens turn choices into reusable decisions.</text>
  <text x="70" y="104" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5f5a54">Change the source once. Let components inherit the system.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="78" y="158" width="276" height="252" rx="8" fill="#263238"/>
    <text x="104" y="196" font-size="18" font-weight="700" fill="#ffffff">:root</text>
    <text x="104" y="235" font-size="15" fill="#e0f2f1">--color-brand: #8a2d3b;</text>
    <text x="104" y="268" font-size="15" fill="#e0f2f1">--color-surface: #fffaf4;</text>
    <text x="104" y="301" font-size="15" fill="#e0f2f1">--space-3: 1rem;</text>
    <text x="104" y="334" font-size="15" fill="#e0f2f1">--radius-card: 8px;</text>
    <text x="104" y="367" font-size="15" fill="#e0f2f1">--shadow-soft: 0 8px 24px ...</text>

    <path d="M384 284 H472" stroke="#8a2d3b" stroke-width="4" stroke-linecap="round"/>
    <path d="M456 268 L474 284 L456 300" fill="none" stroke="#8a2d3b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="512" y="146" width="154" height="98" rx="8" fill="#8a2d3b"/>
    <text x="548" y="203" font-size="20" font-weight="700" fill="#ffffff">button</text>

    <rect x="700" y="146" width="178" height="98" rx="8" fill="#fffaf4" stroke="#d9cec2" stroke-width="2"/>
    <text x="738" y="187" font-size="18" font-weight="700" fill="#232323">card</text>
    <rect x="728" y="204" width="122" height="12" rx="6" fill="#d9cec2"/>

    <rect x="512" y="288" width="366" height="122" rx="8" fill="#f3ebe8" stroke="#8a2d3b" stroke-width="2"/>
    <text x="544" y="333" font-size="19" font-weight="700" fill="#8a2d3b">callout</text>
    <text x="544" y="365" font-size="15" fill="#5f5a54">Uses the same color, spacing,</text>
    <text x="544" y="390" font-size="15" fill="#5f5a54">radius, and type tokens.</text>
  </g>
</svg>
