<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Pages automation pipeline</title>
  <desc id="desc">Five-stage GitHub Pages pipeline from a push to main through install, Vite build, artifact upload, and publication at a repository URL.</desc>
  <rect width="1600" height="900" fill="#fffaf2"/>
  <text x="90" y="116" fill="#2d2724" font-family="Arial, sans-serif" font-size="46" font-weight="700">GitHub Pages Automation Pipeline</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="80" y="250" width="250" height="178" rx="18" fill="#fff" stroke="#2d2724" stroke-width="5"/>
      <circle cx="116" cy="286" r="24" fill="#7a1828"/><text x="116" y="296" fill="#fff" font-size="25" font-weight="700">1</text>
      <text x="205" y="332" fill="#2d2724" font-size="27" font-weight="700">Push source</text>
      <text x="205" y="374" fill="#4f4540" font-size="24">to main</text>
    </g>
    <g>
      <rect x="380" y="250" width="250" height="178" rx="18" fill="#fff" stroke="#2d2724" stroke-width="5"/>
      <circle cx="416" cy="286" r="24" fill="#7a1828"/><text x="416" y="296" fill="#fff" font-size="25" font-weight="700">2</text>
      <text x="505" y="332" fill="#2d2724" font-size="27" font-weight="700">Install</text>
      <text x="505" y="374" fill="#4f4540" font-size="24">dependencies</text>
    </g>
    <g>
      <rect x="680" y="250" width="250" height="178" rx="18" fill="#fff" stroke="#c4a35a" stroke-width="6"/>
      <circle cx="716" cy="286" r="24" fill="#7a1828"/><text x="716" y="296" fill="#fff" font-size="25" font-weight="700">3</text>
      <text x="805" y="332" fill="#2d2724" font-size="27" font-weight="700">Build Vite</text>
      <text x="805" y="374" fill="#4f4540" font-size="24">base: /repository/</text>
    </g>
    <g>
      <rect x="980" y="250" width="250" height="178" rx="18" fill="#fff" stroke="#2d2724" stroke-width="5"/>
      <circle cx="1016" cy="286" r="24" fill="#7a1828"/><text x="1016" y="296" fill="#fff" font-size="25" font-weight="700">4</text>
      <text x="1105" y="332" fill="#2d2724" font-size="27" font-weight="700">Upload dist</text>
      <text x="1105" y="374" fill="#4f4540" font-size="24">Pages artifact</text>
    </g>
    <g>
      <rect x="1280" y="250" width="250" height="178" rx="18" fill="#fff" stroke="#2d2724" stroke-width="5"/>
      <circle cx="1316" cy="286" r="24" fill="#7a1828"/><text x="1316" y="296" fill="#fff" font-size="25" font-weight="700">5</text>
      <text x="1405" y="332" fill="#2d2724" font-size="27" font-weight="700">Publish</text>
      <text x="1405" y="374" fill="#4f4540" font-size="24">Pages URL</text>
    </g>
  </g>
  <g fill="none" stroke="#7a1828" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M336 339h38"/><path d="M360 320l24 19-24 19"/>
    <path d="M636 339h38"/><path d="M660 320l24 19-24 19"/>
    <path d="M936 339h38"/><path d="M960 320l24 19-24 19"/>
    <path d="M1236 339h38"/><path d="M1260 320l24 19-24 19"/>
  </g>
  <rect x="596" y="550" width="408" height="88" rx="14" fill="#f8f3ea" stroke="#c4a35a" stroke-width="5"/>
  <text x="800" y="606" fill="#2d2724" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">username.github.io/repository/</text>
  <path d="M805 428v112" fill="none" stroke="#c4a35a" stroke-width="6" stroke-linecap="round"/>
  <text x="800" y="728" fill="#4f4540" font-family="Arial, sans-serif" font-size="31" text-anchor="middle">The public URL shape and Vite base path must agree.</text>
</svg>
