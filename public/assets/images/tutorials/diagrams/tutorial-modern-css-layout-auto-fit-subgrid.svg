<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Auto-fit grid and subgrid card alignment</title>
  <desc id="desc">A diagram showing responsive card columns and shared row tracks that align category, heading, body text, and links across cards.</desc>
  <rect width="960" height="540" fill="#f7faf9"/>
  <text x="64" y="64" fill="#202124" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="700">Flexible columns, shared rows</text>
  <text x="64" y="104" fill="#60646c" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">auto-fit changes the column count. subgrid can align equivalent content inside the cards.</text>

  <g transform="translate(70 150)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="0" y="0" width="820" height="310" rx="10" fill="#ffffff" stroke="#d8ddda" stroke-width="2"/>
    <g stroke="#d8ddda" stroke-width="2" stroke-dasharray="6 8">
      <path d="M0 86h820"/>
      <path d="M0 136h820"/>
      <path d="M0 200h820"/>
      <path d="M0 260h820"/>
    </g>

    <g transform="translate(28 28)">
      <rect width="230" height="254" rx="8" fill="#ffffff" stroke="#245c4f" stroke-width="2"/>
      <rect width="230" height="58" rx="8" fill="#e8f2ef"/>
      <rect x="18" y="86" width="58" height="18" rx="9" fill="#ffd166"/>
      <rect x="18" y="132" width="176" height="16" rx="8" fill="#245c4f"/>
      <rect x="18" y="164" width="198" height="10" rx="5" fill="#b8ccc5"/>
      <rect x="18" y="184" width="150" height="10" rx="5" fill="#b8ccc5"/>
      <rect x="18" y="226" width="92" height="14" rx="7" fill="#87bba2"/>
    </g>

    <g transform="translate(295 28)">
      <rect width="230" height="254" rx="8" fill="#ffffff" stroke="#245c4f" stroke-width="2"/>
      <rect width="230" height="58" rx="8" fill="#e8f2ef"/>
      <rect x="18" y="86" width="82" height="18" rx="9" fill="#ffd166"/>
      <rect x="18" y="132" width="148" height="16" rx="8" fill="#245c4f"/>
      <rect x="18" y="164" width="186" height="10" rx="5" fill="#b8ccc5"/>
      <rect x="18" y="184" width="192" height="10" rx="5" fill="#b8ccc5"/>
      <rect x="18" y="226" width="92" height="14" rx="7" fill="#87bba2"/>
    </g>

    <g transform="translate(562 28)">
      <rect width="230" height="254" rx="8" fill="#ffffff" stroke="#245c4f" stroke-width="2"/>
      <rect width="230" height="58" rx="8" fill="#e8f2ef"/>
      <rect x="18" y="86" width="102" height="18" rx="9" fill="#ffd166"/>
      <rect x="18" y="132" width="198" height="16" rx="8" fill="#245c4f"/>
      <rect x="18" y="164" width="172" height="10" rx="5" fill="#b8ccc5"/>
      <rect x="18" y="226" width="92" height="14" rx="7" fill="#87bba2"/>
    </g>

    <text x="28" y="346" fill="#245c4f" font-size="16" font-weight="700">grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr))</text>
  </g>
</svg>
