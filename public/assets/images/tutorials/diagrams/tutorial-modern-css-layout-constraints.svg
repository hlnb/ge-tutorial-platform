<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Rigid sizing compared with resilient layout constraints</title>
  <desc id="desc">A diagram comparing a fixed-width card that overflows with a constrained card that can shrink, grow, and stay readable inside its container.</desc>
  <rect width="960" height="520" fill="#f7faf9"/>
  <text x="64" y="64" fill="#202124" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="700">Rigid size vs useful constraints</text>
  <text x="64" y="104" fill="#60646c" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Modern layout asks what may grow, shrink, and stay readable.</text>

  <g transform="translate(64 150)">
    <rect x="0" y="0" width="370" height="270" rx="10" fill="#ffffff" stroke="#d8ddda" stroke-width="2"/>
    <text x="24" y="42" fill="#8d0000" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Rigid card</text>
    <text x="24" y="76" fill="#60646c" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">width: 350px; height: 500px;</text>
    <rect x="24" y="108" width="230" height="118" rx="8" fill="#fbeaea" stroke="#d98a8a" stroke-width="2"/>
    <rect x="248" y="108" width="98" height="118" rx="8" fill="#fbeaea" stroke="#d98a8a" stroke-width="2" stroke-dasharray="7 7"/>
    <path d="M254 167h78" stroke="#8d0000" stroke-width="4" stroke-linecap="round"/>
    <path d="M320 155l16 12-16 12" fill="none" stroke="#8d0000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="252" fill="#8d0000" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Works only when the content and viewport behave.</text>
  </g>

  <g transform="translate(526 150)">
    <rect x="0" y="0" width="370" height="270" rx="10" fill="#ffffff" stroke="#d8ddda" stroke-width="2"/>
    <text x="24" y="42" fill="#245c4f" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Resilient card</text>
    <text x="24" y="76" fill="#60646c" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">minmax(min(100%, 18rem), 1fr)</text>
    <rect x="24" y="108" width="322" height="118" rx="8" fill="#e8f2ef" stroke="#245c4f" stroke-width="2"/>
    <rect x="48" y="132" width="120" height="16" rx="8" fill="#87bba2"/>
    <rect x="48" y="162" width="242" height="12" rx="6" fill="#b8ccc5"/>
    <rect x="48" y="186" width="190" height="12" rx="6" fill="#b8ccc5"/>
    <path d="M42 98v-18h288v18" fill="none" stroke="#245c4f" stroke-width="3" stroke-linecap="round"/>
    <text x="24" y="252" fill="#245c4f" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Gives the browser boundaries and room to decide.</text>
  </g>
</svg>
