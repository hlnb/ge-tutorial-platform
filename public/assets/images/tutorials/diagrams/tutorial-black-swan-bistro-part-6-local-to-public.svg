<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Local project to public site deployment path</title>
  <desc id="desc">Diagram showing the Black Swan Bistro moving from a localhost laptop through files, host, and HTTPS to a public site on a phone.</desc>
  <rect width="1600" height="900" fill="#f8f3ea"/>
  <rect x="88" y="86" width="1424" height="728" rx="28" fill="#fffaf2" stroke="#2d2724" stroke-width="6"/>
  <text x="140" y="160" fill="#2d2724" font-family="Arial, sans-serif" font-size="42" font-weight="700">LOCAL PROJECT</text>
  <text x="1165" y="160" fill="#2d2724" font-family="Arial, sans-serif" font-size="42" font-weight="700">PUBLIC SITE</text>
  <rect x="132" y="252" width="426" height="278" rx="20" fill="#26201d"/>
  <rect x="162" y="282" width="366" height="206" rx="10" fill="#fffaf2"/>
  <text x="205" y="344" fill="#7a1828" font-family="Arial, sans-serif" font-size="32" font-weight="700">Black Swan Bistro</text>
  <rect x="206" y="375" width="232" height="18" rx="9" fill="#c4a35a"/>
  <rect x="206" y="418" width="286" height="18" rx="9" fill="#d9d0c0"/>
  <rect x="206" y="455" width="180" height="18" rx="9" fill="#d9d0c0"/>
  <text x="214" y="580" fill="#2d2724" font-family="Arial, sans-serif" font-size="28">localhost:5173</text>
  <g fill="none" stroke="#7a1828" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M590 410h116"/>
    <path d="M695 386l34 24-34 24"/>
    <path d="M842 410h116"/>
    <path d="M947 386l34 24-34 24"/>
    <path d="M1094 410h116"/>
    <path d="M1199 386l34 24-34 24"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="714" y="316" width="128" height="188" rx="18" fill="#fff" stroke="#c4a35a" stroke-width="5"/>
    <text x="778" y="394" fill="#2d2724" font-size="30" font-weight="700">files</text>
    <rect x="966" y="316" width="128" height="188" rx="18" fill="#fff" stroke="#c4a35a" stroke-width="5"/>
    <text x="1030" y="394" fill="#2d2724" font-size="30" font-weight="700">host</text>
    <rect x="1218" y="316" width="128" height="188" rx="18" fill="#fff" stroke="#c4a35a" stroke-width="5"/>
    <text x="1282" y="394" fill="#2d2724" font-size="30" font-weight="700">HTTPS</text>
  </g>
  <rect x="1244" y="238" width="204" height="382" rx="34" fill="#26201d"/>
  <rect x="1264" y="284" width="164" height="276" rx="12" fill="#fffaf2"/>
  <text x="1280" y="334" fill="#7a1828" font-family="Arial, sans-serif" font-size="21" font-weight="700">Black Swan</text>
  <text x="1280" y="365" fill="#7a1828" font-family="Arial, sans-serif" font-size="21" font-weight="700">Bistro</text>
  <rect x="1280" y="394" width="116" height="12" rx="6" fill="#c4a35a"/>
  <rect x="1280" y="428" width="132" height="12" rx="6" fill="#d9d0c0"/>
  <rect x="1280" y="458" width="92" height="12" rx="6" fill="#d9d0c0"/>
  <text x="1190" y="690" fill="#2d2724" font-family="Arial, sans-serif" font-size="28">https://black-swan.example</text>
  <text x="800" y="740" fill="#4f4540" font-family="Arial, sans-serif" font-size="31" text-anchor="middle">DEPLOY: move browser-ready files to a host that answers public requests.</text>
