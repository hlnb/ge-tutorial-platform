<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Updates, backups, and version control relationship map</title>
  <desc id="desc">A map shows updates changing the site, version control tracking code changes, backups preserving recoverable data, and rollback connecting to recovery.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#2f4858"/></marker></defs>
  <rect width="1120" height="520" rx="28" fill="#f8fafb"/>
  <text x="560" y="58" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#172a3a">Updates, version control, and backups are different safety nets</text>
  <text x="560" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#52606d">Good maintenance means knowing which safety net protects which part of the site.</text>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="440" y="160" width="240" height="120" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
    <text x="560" y="208" text-anchor="middle" font-size="24" font-weight="700" fill="#172a3a">Live website</text>
    <text x="560" y="240" text-anchor="middle" font-size="16" fill="#52606d">what visitors use</text>
    <rect x="80" y="170" width="230" height="100" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="195" y="212" text-anchor="middle" font-size="22" font-weight="700" fill="#b45309">Updates</text>
    <text x="195" y="240" text-anchor="middle" font-size="15" fill="#7c2d12">change code or systems</text>
    <rect x="810" y="170" width="230" height="100" rx="18" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="2"/>
    <text x="925" y="212" text-anchor="middle" font-size="22" font-weight="700" fill="#15803d">Version control</text>
    <text x="925" y="240" text-anchor="middle" font-size="15" fill="#166534">tracks file changes</text>
    <rect x="190" y="340" width="260" height="100" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="320" y="382" text-anchor="middle" font-size="22" font-weight="700" fill="#0369a1">Backups</text>
    <text x="320" y="410" text-anchor="middle" font-size="15" fill="#1e40af">recover files, data, uploads</text>
    <rect x="670" y="340" width="260" height="100" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
    <text x="800" y="382" text-anchor="middle" font-size="22" font-weight="700" fill="#6d28d9">Rollback</text>
    <text x="800" y="410" text-anchor="middle" font-size="15" fill="#5b21b6">return to a working version</text>
  </g>
  <g fill="none" stroke="#2f4858" stroke-width="4" marker-end="url(#arrow)">
    <path d="M310 220 H428"/><path d="M692 220 H798"/><path d="M475 282 L380 333"/><path d="M645 282 L740 333"/><path d="M688 390 H462"/>
  </g>
  <text x="560" y="482" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="650" fill="#334155">A safe update process asks: what changed, what is tracked, what is backed up, and how do we undo it?</text>
</svg>
