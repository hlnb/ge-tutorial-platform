<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Correct and incorrect document-root structure</title>
  <desc id="desc">Correct document-root diagram with index.html directly in public_html, compared with an incorrect extra release-folder level.</desc>
  <rect width="1600" height="900" fill="#fffaf2"/>
  <text x="100" y="120" fill="#2d2724" font-family="Arial, sans-serif" font-size="46" font-weight="700">Static Hosting Document Root</text>
  <text x="100" y="180" fill="#4f4540" font-family="Arial, sans-serif" font-size="30">The server only serves the folder the domain points to.</text>
  <g font-family="Arial, sans-serif" font-size="31" font-weight="700">
    <rect x="110" y="278" width="330" height="130" rx="16" fill="#ffffff" stroke="#2f7d53" stroke-width="6"/>
    <text x="148" y="358" fill="#2d2724">your-domain.example</text>
    <path d="M462 343h150" stroke="#2f7d53" stroke-width="8" stroke-linecap="round"/>
    <path d="M592 317l38 26-38 26" fill="none" stroke="#2f7d53" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="654" y="278" width="260" height="130" rx="16" fill="#ffffff" stroke="#2f7d53" stroke-width="6"/>
    <text x="710" y="358" fill="#2d2724">/public_html</text>
    <path d="M938 343h150" stroke="#2f7d53" stroke-width="8" stroke-linecap="round"/>
    <path d="M1068 317l38 26-38 26" fill="none" stroke="#2f7d53" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1130" y="258" width="360" height="170" rx="16" fill="#ffffff" stroke="#2f7d53" stroke-width="6"/>
    <text x="1180" y="326" fill="#2d2724">index.html</text>
    <text x="1180" y="374" fill="#2d2724">css/ js/ images/</text>
    <text x="1168" y="492" fill="#2f7d53" font-size="28">Correct</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="31" font-weight="700">
    <rect x="654" y="590" width="260" height="130" rx="16" fill="#fff" stroke="#9f1239" stroke-width="6"/>
    <text x="710" y="670" fill="#2d2724">/public_html</text>
    <path d="M938 655h150" stroke="#9f1239" stroke-width="8" stroke-dasharray="18 14" stroke-linecap="round"/>
    <path d="M1068 629l38 26-38 26" fill="none" stroke="#9f1239" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1130" y="568" width="360" height="176" rx="16" fill="#fff" stroke="#9f1239" stroke-width="6"/>
    <text x="1174" y="633" fill="#2d2724">release-folder/</text>
    <text x="1174" y="681" fill="#2d2724">index.html</text>
    <text x="1148" y="808" fill="#9f1239" font-size="28">Extra folder: hidden or wrong URL</text>
  </g>
</svg>
