<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vercel production and preview branches</title>
  <desc id="desc">Branch diagram showing main creating a production Vercel deployment while a feature branch and pull request create preview deployments.</desc>
  <rect width="1600" height="900" fill="#f8f3ea"/>
  <text x="96" y="118" fill="#2d2724" font-family="Arial, sans-serif" font-size="46" font-weight="700">Vercel Production and Preview Deployments</text>
  <g font-family="Arial, sans-serif">
    <rect x="110" y="370" width="260" height="135" rx="18" fill="#fff" stroke="#2d2724" stroke-width="5"/>
    <text x="160" y="424" fill="#2d2724" font-size="29" font-weight="700">GitHub repo</text>
    <text x="160" y="466" fill="#4f4540" font-size="24">source history</text>
    <path d="M390 438 C530 260, 660 240, 790 240" fill="none" stroke="#2f7d53" stroke-width="8"/>
    <path d="M390 438 C530 438, 660 438, 790 438" fill="none" stroke="#c4a35a" stroke-width="8"/>
    <path d="M390 438 C530 620, 660 640, 790 640" fill="none" stroke="#7a1828" stroke-width="8"/>
    <rect x="810" y="180" width="250" height="120" rx="16" fill="#fff" stroke="#2f7d53" stroke-width="5"/>
    <text x="870" y="254" fill="#2d2724" font-size="29" font-weight="700">main</text>
    <rect x="810" y="378" width="250" height="120" rx="16" fill="#fff" stroke="#c4a35a" stroke-width="5"/>
    <text x="850" y="452" fill="#2d2724" font-size="29" font-weight="700">feature/menu</text>
    <rect x="810" y="580" width="250" height="120" rx="16" fill="#fff" stroke="#7a1828" stroke-width="5"/>
    <text x="850" y="654" fill="#2d2724" font-size="29" font-weight="700">pull request</text>
    <g fill="none" stroke="#2d2724" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1082 240h72"/><path d="M1134 222l28 18-28 18"/>
      <path d="M1082 438h72"/><path d="M1134 420l28 18-28 18"/>
      <path d="M1082 640h72"/><path d="M1134 622l28 18-28 18"/>
    </g>
    <rect x="1180" y="166" width="300" height="148" rx="18" fill="#fff" stroke="#2f7d53" stroke-width="6"/>
    <text x="1230" y="225" fill="#2d2724" font-size="29" font-weight="700">Production URL</text>
    <text x="1230" y="267" fill="#4f4540" font-size="24">live branch result</text>
    <rect x="1180" y="364" width="300" height="148" rx="18" fill="#fff" stroke="#c4a35a" stroke-width="6"/>
    <text x="1238" y="423" fill="#2d2724" font-size="29" font-weight="700">Preview URL</text>
    <text x="1238" y="465" fill="#4f4540" font-size="24">review safely</text>
    <rect x="1180" y="566" width="300" height="148" rx="18" fill="#fff" stroke="#7a1828" stroke-width="6"/>
    <text x="1238" y="625" fill="#2d2724" font-size="29" font-weight="700">Preview URL</text>
    <text x="1238" y="667" fill="#4f4540" font-size="24">review before merge</text>
  </g>
  <text x="800" y="800" fill="#4f4540" font-family="Arial, sans-serif" font-size="31" text-anchor="middle">Preview deployments do not modify production; they give proposed changes their own reviewable result.</text>
</svg>
