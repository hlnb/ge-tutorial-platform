<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Monthly website health check matrix</title>
  <desc id="desc">A matrix groups monthly website checks into content, links, SEO, accessibility, performance, analytics, and backups.</desc>
  <rect width="1120" height="520" rx="28" fill="#f8fafb"/>
  <text x="560" y="58" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#172a3a">Monthly health checks look across the whole site</text>
  <text x="560" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#52606d">Group the work so maintenance stays repeatable instead of sprawling.</text>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="90" y="140" width="940" height="300" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="205" y="198" fill="#0369a1">Content</text>
      <text x="430" y="198" fill="#b45309">Links + forms</text>
      <text x="655" y="198" fill="#15803d">SEO</text>
      <text x="880" y="198" fill="#6d28d9">Accessibility</text>
      <text x="205" y="326" fill="#be123c">Performance</text>
      <text x="430" y="326" fill="#0f766e">Analytics</text>
      <text x="655" y="326" fill="#334155">Backups</text>
      <text x="880" y="326" fill="#7c2d12">Updates</text>
    </g>
    <g fill="#f1f5f9" stroke="#d9e2ec" stroke-width="2">
      <rect x="125" y="218" width="160" height="54" rx="12"/><rect x="350" y="218" width="160" height="54" rx="12"/><rect x="575" y="218" width="160" height="54" rx="12"/><rect x="800" y="218" width="160" height="54" rx="12"/>
      <rect x="125" y="346" width="160" height="54" rx="12"/><rect x="350" y="346" width="160" height="54" rx="12"/><rect x="575" y="346" width="160" height="54" rx="12"/><rect x="800" y="346" width="160" height="54" rx="12"/>
    </g>
    <g font-size="14" fill="#52606d" text-anchor="middle">
      <text x="205" y="251">accurate + current</text><text x="430" y="251">actions still work</text><text x="655" y="251">findable pages</text><text x="880" y="251">usable by more people</text>
      <text x="205" y="379">comfortable loading</text><text x="430" y="379">patterns, not panic</text><text x="655" y="379">restore options</text><text x="880" y="379">test before merging</text>
    </g>
  </g>
  <text x="560" y="482" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="650" fill="#334155">Monthly care is deeper than weekly triage, but still bounded and repeatable.</text>
</svg>
